
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity Web Player</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title"></div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");

      var div = document.createElement("div");
      div.textContent = msg;
      div.style.padding = "10px";

      if (type === "error") {
        div.style.background = "red";
        div.style.color = "white";
      } else if (type === "warning") {
        div.style.background = "yellow";
        div.style.color = "black";
      }

      warningBanner.appendChild(div);
      warningBanner.style.display = "block";

      if (type !== "error") {
        setTimeout(function () {
          if (div.parentNode === warningBanner) {
            warningBanner.removeChild(div);
          }

          warningBanner.style.display =
            warningBanner.children.length ? "block" : "none";
        }, 5000);
      }
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/webGL.loader.js";

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/webGL.data.unityweb",
      frameworkUrl: buildUrl + "/webGL.framework.js.unityweb",
      codeUrl: buildUrl + "/webGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Unity Game",
      productVersion: "0.1",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

      document.head.appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#unity-progress-bar-full").style.width =
          (100 * progress) + "%";
      }).then(function (unityInstance) {
        document.querySelector("#unity-loading-bar").style.display = "none";

        document.querySelector("#unity-fullscreen-button").onclick =
          function () {
            unityInstance.SetFullscreen(1);
          };
      }).catch(function (message) {
        unityShowBanner("Unity could not start: " + message, "error");
      });
    };

    script.onerror = function () {
      unityShowBanner(
        "Could not load Build/webGL.loader.js. Check the filename and folder.",
        "error"
      );
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
