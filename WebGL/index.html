
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity Web Player | QuickGuides</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">QuickGuides</div>
    </div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(message, type) {
      const banner = document.querySelector("#unity-warning");
      const div = document.createElement("div");
      div.textContent = message;
      div.style.padding = "10px";

      if (type === "error") {
        div.style.background = "red";
      } else if (type === "warning") {
        div.style.background = "yellow";
      }

      banner.appendChild(div);
      banner.style.display = "block";

      if (type !== "error") {
        setTimeout(() => {
          div.remove();
          banner.style.display =
            banner.children.length ? "block" : "none";
        }, 5000);
      }
    }

    const buildUrl = "Build";

    // Match the actual filename in WebGL/Build.
    const loaderUrl = buildUrl + "/WebGL.loader.js";

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "QuickGuides",
      productVersion: "0.1",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);

      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width =
          (100 * progress) + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";

        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((error) => {
        console.error(error);
        unityShowBanner("Failed to load the Unity game: " + error, "error");
      });
    };

    script.onerror = () => {
      unityShowBanner(
        "Could not load Build/WebGL.loader.js. Check the filename and Build folder.",
        "error"
      );
      console.error("Failed to load:", loaderUrl);
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
