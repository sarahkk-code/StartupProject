
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickGuides | Unity WebGL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #171717;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    #game-container {
      position: relative;
      width: min(960px, 100%);
    }

    #unity-canvas {
      display: block;
      width: 100%;
      aspect-ratio: 8 / 5;
      background: #222222;
      outline: none;
    }

    #loading {
      width: 100%;
      margin: 14px 0;
      text-align: center;
    }

    #progress-track {
      width: min(320px, 90%);
      height: 12px;
      margin: 10px auto;
      border-radius: 20px;
      background: #444444;
      overflow: hidden;
    }

    #progress {
      height: 100%;
      width: 0%;
      background: #72d572;
      transition: width 0.15s linear;
    }

    #status {
      max-width: 960px;
      margin-top: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #ffb4b4;
      font-size: 14px;
    }

    #fullscreen {
      margin-top: 12px;
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      background: #ffffff;
      color: #171717;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>QuickGuides</h1>

  <main id="game-container">
    <canvas id="unity-canvas" width="960" height="600"
            tabindex="-1"></canvas>
  </main>

  <div id="loading">
    <div id="loading-message">Loading QuickGuides...</div>
    <div id="progress-track">
      <div id="progress"></div>
    </div>
  </div>

  <div id="status" role="alert"></div>
  <button id="fullscreen" type="button">Fullscreen</button>

  <script>
    (() => {
      const canvas = document.getElementById("unity-canvas");
      const loading = document.getElementById("loading");
      const progress = document.getElementById("progress");
      const loadingMessage = document.getElementById("loading-message");
      const status = document.getElementById("status");
      const fullscreen = document.getElementById("fullscreen");

      const buildUrl = "Build";

      // These paths must match the actual files in Build/.
      // This version is for a Unity build with compression disabled.
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "QuickGuides",
        productVersion: "0.1",
        showBanner: (message, type) => {
          status.textContent = message;
          status.style.color =
            type === "error" ? "#ff7777" : "#ffdb75";
        }
      };

      function showError(message) {
        loading.style.display = "none";
        status.textContent = message;
        console.error(message);
      }

      const loader = document.createElement("script");
      loader.src = buildUrl + "/WebGL.loader.js";

      loader.onload = () => {
        if (typeof createUnityInstance !== "function") {
          showError("Unity loader loaded, but createUnityInstance was not found.");
          return;
        }

        createUnityInstance(canvas, config, value => {
          progress.style.width = (value * 100) + "%";
          loadingMessage.textContent =
            "Loading QuickGuides... " + Math.round(value * 100) + "%";
        }).then(instance => {
          loading.style.display = "none";
          status.textContent = "";

          fullscreen.addEventListener("click", () => {
            instance.SetFullscreen(1);
          });
        }).catch(error => {
          showError("Unity could not start:\n" + error);
        });
      };

      loader.onerror = () => {
        showError(
          "Could not load Build/WebGL.loader.js. " +
          "Check that the file exists in your GitHub repository."
        );
      };

      document.body.appendChild(loader);
    })();
  </script>
</body>
</html>
