
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickGuides</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #231f20;
      overflow: hidden;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #unity-canvas {
      width: min(960px, 100vw);
      height: min(600px, calc(100vh - 40px));
      background: #231f20;
    }

    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
    }

    #unity-progress-bar-empty {
      width: 200px;
      height: 10px;
      margin-top: 12px;
      background: #555;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: #fff;
    }

    #unity-warning {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: min(90%, 700px);
      color: #111;
    }

    #unity-footer {
      width: min(960px, 100vw);
      display: flex;
      justify-content: flex-end;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
      padding-top: 8px;
    }

    #unity-fullscreen-button {
      cursor: pointer;
      margin-right: 12px;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div>Loading QuickGuides...</div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-fullscreen-button">Fullscreen ⛶</div>
      <div id="unity-build-title">QuickGuides</div>
    </div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull =
      document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(message, type) {
      const banner = document.createElement("div");
      banner.textContent = message;
      banner.style.padding = "10px";
      banner.style.marginTop = "5px";

      if (type === "error") {
        banner.style.background = "#ffcccc";
        banner.style.color = "#900";
      } else {
        banner.style.background = "#ffffcc";
        banner.style.color = "#333";
      }

      warningBanner.appendChild(banner);
      warningBanner.style.display = "block";

      if (type !== "error") {
        setTimeout(() => {
          banner.remove();
          if (!warningBanner.children.length) {
            warningBanner.style.display = "none";
          }
        }, 5000);
      }
    }

    const buildUrl = "Build";

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "QuickGuides",
      productVersion: "0.1",
      showBanner: unityShowBanner
    };

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (progress * 100) + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";

        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((error) => {
        console.error(error);
        unityShowBanner("Unity could not start: " + error, "error");
      });
    };

    script.onerror = () => {
      console.error("Failed to load Unity loader:", script.src);
      unityShowBanner(
        "Could not load Build/WebGL.loader.js. Check the file path and capitalization.",
        "error"
      );
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
